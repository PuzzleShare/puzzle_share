name: game server cd

on:
  push:
    branches:
      - test # 배포 트리거 대상 브랜치
    paths:
      - 'websocket/**'

defaults:
  run:
    working-directory: websocket

env:
  LIGHTSAIL_USERNAME: ubuntu
  AWS_REGION: ap-northeast-2

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.SUBMODULE_TOKEN }}
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: List build artifacts
        run: ls -al ./build/libs/

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Verify AWS Credentials
        run: aws configure list

      - name: Upload files to Lightsail
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ env.LIGHTSAIL_USERNAME }}
          port: 22
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: 'websocket/build/libs/websocket-0.0.1-SNAPSHOT.jar' # 고정된 JAR 파일 이름 사용
          target: '/home/ubuntu/game/dist/websocket/build/libs/' # 타겟 디렉토리 수정
          use_insecure_cipher: true
          debug: true

      - name: Restart Spring Boot process
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ env.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            # 고정된 JAR 파일 이름 설정
            JAR_NAME="websocket-0.0.1-SNAPSHOT.jar"
            BUILD_PATH="/home/ubuntu/game/dist/websocket/build/libs/${JAR_NAME}"
            DEPLOY_PATH="/home/ubuntu/game/deploy/"
            DEPLOY_JAR="${DEPLOY_PATH}${JAR_NAME}"

            # 현재 실행 중인 JAR 프로세스 찾기
            CURRENT_PID=$(pgrep -f "${JAR_NAME}")

            # 현재 실행 중인 프로세스가 있으면 종료
            if [ -z "${CURRENT_PID}" ]; then
              echo "No running process found for ${JAR_NAME}."
              sleep 1
            else
              echo "Killing process ${CURRENT_PID} for ${JAR_NAME}."
              kill -15 "${CURRENT_PID}"
              sleep 5
            fi

            # 새 JAR 파일을 배포 디렉토리로 복사
            echo "Copying ${BUILD_PATH} to ${DEPLOY_PATH}."
            cp "${BUILD_PATH}" "${DEPLOY_PATH}"

            # 배포 디렉토리로 이동
            cd "${DEPLOY_PATH}" || exit

            # 새 JAR 파일 실행
            echo "Starting ${DEPLOY_JAR}."
            nohup java -jar "${DEPLOY_JAR}" > /dev/null 2> /dev/null < /dev/null &
